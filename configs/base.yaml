# Đỗ Ngọc Tân - seed, artifacts.mode (dev/runs), log; gộp các file config khác qua includes. Duyệt: Nguyễn Thị Ánh Ngọc.

includes:
  - universe.yaml
  - data.yaml
  - regime.yaml
  - scenarios.yaml
  - risk.yaml
  - quantum.yaml

# TODO(Đỗ Ngọc Tân): seed toàn cục mặc định — chưa được nêu ở bất kỳ tài liệu nguồn nào.
# Seed riêng của từng module (regime, QAOA...) nằm trong file config của module đó.
seed: null

artifacts:
  mode: dev  # dev | runs
  # dev  -> artifacts/dev/... (đường dẫn cố định, lặp nhanh khi đang phát triển)
  # runs -> artifacts/runs/run_YYYYMMDD_HHMM/... (có version — bắt buộc dùng từ ngày 4 sprint,
  #         mọi số lên slide/demo phải truy được về một run_id, xem docs/architecture/pipeline.md §4)

logging:
  level: INFO
  # TODO(Đỗ Ngọc Tân): đường dẫn log file nếu cần ghi ra ngoài logs.txt mặc định của RunContext
  path: null

# Version/identifier dùng bởi packages/data (qshield_data.manifest, sources.registry) — thêm khi
# refactor CLEAN.ipynb → qshield_data (xem plan.md §3.4). Không phải tham số tài chính, chỉ là
# nhãn version cho manifest/data dictionary/source register.
data:
  data_version: "v1.0.0"
  universe_version: "v1.0"
  universe_as_of: "2026-08-03"

# Đường dẫn gốc cho data/ và reports/ (khác với artifacts/ — nơi đó do
# qshield_contracts.paths.ArtifactPaths quản lý theo run_id, xem CLAUDE.md quy tắc 8). data/ và
# reports/ không version theo run, chỉ có một bộ processed/metadata "chính thức" tại một thời điểm.
paths:
  data_root: "data"
  reports_root: "reports"
