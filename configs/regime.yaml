# Nguyễn Anh Tú - HMM: 3 trạng thái, 10 seed, danh sách feature.

n_states: 3  # đã khóa — CLAUDE.md: "Phạm vi đã khóa: ... 3 trạng thái"
n_iter: 500  # đã khóa — docs/Structure.md: "GaussianHMM 3 trạng thái, 10 seed, n_iter=500"

# đã khóa — dùng khi HMM không hội tụ, xem docs/runbook/troubleshooting.md §4
covariance_type: diag

seeds:
  count: 10  # đã khóa — CLAUDE.md/docs/Structure.md
  # PROVISIONAL (IN-CTR-09): danh sách đề xuất ở ai-input-proposal-v0.1.md §3.2, chờ Ngọc duyệt.
  # Mọi seed đã đăng ký đều phải báo cáo — không cherry-pick seed đẹp nhất.
  values: [101, 202, 303, 404, 505, 606, 707, 808, 909, 1001]

# ĐÚNG 5 feature (AD-01, xem docs/architecture/ai-decisions-v0.2.md).
feature_contract_version: "v0.2"
features:
  market_columns:
    - market_log_return
    - realized_vol_20d
    - drawdown
    - liquidity_20d
  corr_window: 60  # mean_pairwise_corr_60d — AI tính, cần panel đủ N mã (AD-16)

# AD-02: transform trước khi scale. Cột không khai báo giữ nguyên.
transforms:
  realized_vol_20d: log
  mean_pairwise_corr_60d: fisher_z
scaler: standard

# AD-03: lưới candidate được BÁO CÁO đầy đủ (PR-REG-002/AC-REG-001), champion ghim ở 3/diag.
candidates:
  n_states: [2, 3, 4, 5]
  covariance_type: [diag, full]
champion:
  n_states: 3
  covariance_type: diag

# AD-04/AD-05: điều kiện để một fit hợp lệ trước vòng chọn medoid. PROVISIONAL.
gate:
  min_state_occupancy: 0.02  # mỗi state phải chiếm >= 2% số ngày
  # PROVISIONAL (AD-04): ngưỡng đồng thuận nhãn giữa các seed, do AI đề xuất, chờ Ngọc duyệt.
  # Với 3 nhãn, đồng thuận ngẫu nhiên ~0.33; 0.60 là mức tối thiểu để coi là fit ổn định.
  # Champion chỉ có 1 seed hợp lệ ⇒ mean agreement là NaN ⇒ NaN >= 0.60 sai ⇒ cổng đóng.
  # Đó là hành vi mong muốn: đồng thuận đo từ một seed không phải bằng chứng.
  min_mean_label_agreement: 0.60

# AD-07: fallback rule-based. PROVISIONAL — chờ Ngọc (IN-PO-02) và Phúc.
fallback:
  vol_quantile: 0.8          # phân vị volatility trên TRAIN để coi là căng thẳng
  drawdown_threshold: -0.10  # drawdown <= -10% mới đủ điều kiện stress

# Nhãn trạng thái PHẢI được gán sau khi fit, theo đặc trưng thống kê (return/volatility/drawdown),
# không theo state id — xem CLAUDE.md quy tắc 7. Không cấu hình bằng static mapping ở đây.
