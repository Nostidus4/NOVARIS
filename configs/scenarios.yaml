# Nguyễn Anh Tú - S=2000 kịch bản (dev), H=20 ngày, block=5.

# TL-005: development dùng 2.000 kịch bản; final baseline ưu tiên 5.000. Chỉ được chốt final trong
# khoảng 2.000–4.999 nếu 5.000 không đáp ứng runtime/RAM/gate stability, và khi đó report phải ghi
# `num_scenarios`, lý do chọn, benchmark runtime/RAM, verdict Scenario Gate và limitation. Không so
# sánh hai run với S khác nhau nếu không ghi rõ S — `scenario_manifest.json` đã emit trường này.
#
# Chi phí thời gian KHÔNG phải là lý do giữ S thấp: đo ở docs/perf/2026-08-04-pipeline-timing.md §3
# cho thấy 500 → 5.000 chỉ tốn thêm ~1 giây ở N=8. Benchmark cho universe 30 mã (TL-001) chưa chạy —
# `qshield-ai scenarios` giữ 6 cube trong RAM cùng lúc (simple + log × 3 regime), nên RAM mới là ràng
# buộc cần đo trước khi nâng lên 5.000 cho final.
num_scenarios: 2000
horizon_days: 20      # đã khóa — CLAUDE.md
block_length: 5       # đã khóa — docs/Structure.md: "moving-block bootstrap, block 5 → 20 ngày"

cvae:
  # TÙY CHỌN — chỉ bật khi bootstrap champion đã pass toàn bộ check phân phối.
  # CLAUDE.md "Đóng băng phạm vi": CVAE không được thêm trừ khi bootstrap đã qua kiểm định.
  enabled: false

# PROVISIONAL (IN-CTR-09): seed bootstrap do AI đề xuất, chờ Ngọc duyệt.
# Tên khóa KHÔNG được là `seed`: `Config.load` gộp phẳng và `merged.update(config)` khiến key
# top-level của base.yaml luôn đè include, nên `seed` ở đây sẽ vĩnh viễn không đọc được.
scenario_seed: 20260804

# AD-09 (IN-RISK-02/DR-R-05): ngày đánh giá t. null ⇒ ngày cuối vừa có nhãn regime vừa đủ N mã.
evaluation_date: null

# AD-13 (IN-RISK-03): Phúc sở hữu Scenario Validation Gate. Toàn bộ ngưỡng dưới đây là
# PROVISIONAL do AI đề xuất — run vẫn NON_BASELINE_RUN cho tới khi Phúc ký.
# Reference = realized forward 20-day windows sau mỗi anchor cùng regime, cắt tại t.
validation:
  reference: regime_matched_forward_windows
  # PROVISIONAL (IN-RISK-03): số cửa sổ tham chiếu tối thiểu để một verdict PASS được coi là
  # đủ tin cậy. Dưới ngưỡng này, PASS bị hạ xuống WARN (mẫu quá mỏng để chứng nhận) — nhưng
  # một metric VI PHẠM ngưỡng vẫn FAIL, mẫu nhỏ không làm vi phạm biến mất. AI đề xuất, chờ
  # Phúc duyệt.
  min_reference_windows: 30
  thresholds:
    mean_abs_diff_max: 0.0010
    std_ratio_min: 0.80
    std_ratio_max: 1.25
    skew_abs_diff_max: 1.0
    kurtosis_abs_diff_max: 5.0
    quantile_rel_error_max: 0.25
    autocorr_abs_diff_max: 0.10
    corr_mean_abs_diff_max: 0.10
    tail_coverage_ratio_min: 0.5
    tail_coverage_ratio_max: 2.0
