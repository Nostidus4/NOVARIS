# Nguyen Thi Anh Ngoc - profile tach rieng cho BAN DEMO NHANH.
#
# Muc tieu: giu duong chay end-to-end ngan, de nhom demo pipeline/data/AI/Risk sớm.
# Khong dung profile nay de tuyen bo da dat workflow update 30 -> top 10 -> Quantum 20 bit.

profile:
  id: demo_fast
  name: "Demo nhanh"
  status: NON_BASELINE_RUN
  owner: "Nguyen Thi Anh Ngoc"
  purpose: "Chay nhanh end-to-end de demo va debug integration"
  report_label: "Demo Fast - 8 tickers, 500 scenarios, one 20pct action"
  allowed_for:
    - local_debug
    - live_demo_fast
    - integration_smoke_test
  not_allowed_for:
    - final_uat_baseline
    - product_claim_full_workflow
    - quantum_advantage_claim

governance:
  source_of_truth:
    - "configs/universe.yaml"
    - "configs/scenarios.yaml"
    - "configs/risk.yaml"
    - "configs/quantum.yaml"
    - "docs/perf/2026-08-04-pipeline-timing.md"
    - "docs/perf/2026-08-04-scenario-scaling.md"
  approval_required_before_public_demo:
    product_owner: "Nguyen Thi Anh Ngoc"
    data_owner: "Nguyen Do Minh Anh"
    ai_owner: "Nguyen Anh Tu"
    risk_owner: "Lieu Hoai Phuc"
    quantum_owner: "Do Ngoc Tan"
  disclosure:
    - "Universe 8 ma la scope rut gon/provisional."
    - "Chua co candidate selection 30 -> top 10."
    - "Action chi co mot muc 20%, chua phai action grid 0/10/20/30."
    - "Ket qua chi dung de demo flow, khong dung lam baseline workflow update."

data:
  universe_mode: fixed_subset
  universe_family: VN30_subset
  snapshot_date: "2026-08-03"
  expected_input_tickers: 8
  ticker_source: "configs/universe.yaml"
  required_tickers:
    - ACB
    - CTG
    - VCB
    - HPG
    - VIC
    - MWG
    - VNM
    - FPT
  adjusted_price_policy:
    required_field: adjusted_close
    return_calculation: "simple_return/log_return tinh tu adjusted_close"
    dnse_assumption: "DNSE Close duoc gan thanh Adj Close vi loader dang gia dinh DNSE da adjusted"
    risk_flag: "ADJ_CLOSE_EVIDENCE_INCOMPLETE"
  date_range:
    market_train_start: "2016-01-01"
    asset_train_start: "2018-07-02"
    validation_start: "2023-01-01"
    test_start: "2024-01-01"
    test_end: "2026-07-31"
  eligibility:
    min_history_sessions: 252
    min_coverage_pct: 0.98
    min_turnover_20d_vnd: 1000000000

regime:
  engine: GaussianHMM
  champion:
    n_states: 3
    labels:
      - normal
      - volatile
      - stress
    covariance_type: diag
    n_iter: 500
  seeds:
    count: 10
    values: [101, 202, 303, 404, 505, 606, 707, 808, 909, 1001]
  feature_contract_version: "v0.2"
  features:
    market_columns:
      - market_log_return
      - realized_vol_20d
      - drawdown
      - liquidity_20d
    ai_computed_columns:
      - mean_pairwise_corr_60d

scenarios:
  method: moving_block_bootstrap
  num_scenarios_default: 500
  num_scenarios_experiment:
    - 500
    - 2000
    - 5000
  horizon_days: 20
  block_length: 5
  target_regime_policy: "latest_or_selected_regime"
  validation_gate:
    owner: "Lieu Hoai Phuc"
    status: PROVISIONAL
    hard_fail_behavior: "do_not_write_final_cube_without_force"
    thresholds:
      mean_abs_diff_max: 0.0010
      std_ratio_min: 0.80
      std_ratio_max: 1.25
      skew_abs_diff_max: 1.0
      kurtosis_abs_diff_max: 5.0
      quantile_rel_error_max: 0.25
      autocorr_abs_diff_max: 0.10
      corr_mean_abs_diff_max: 0.10
      tail_coverage_ratio_min: 0.5
      tail_coverage_ratio_max: 2.0

risk:
  scope: fixed_8_assets
  baseline_metrics:
    - VaR_95
    - CVaR_95
    - VaR_97_5
    - CVaR_97_5
    - VaR_99
    - CVaR_99
    - expected_horizon_return
    - worst_scenario_max_drawdown
    - transaction_cost
    - cash_generated
  cvar_alpha_primary: 0.95
  action_space:
    mode: single_reduction
    levels_pct: [20]
    action_reduction_pct: 0.20
  candidate_selection:
    enabled: false
    reason: "Demo nhanh khong chon top 10; toan bo 8 ma duoc dua vao risk/quantum demo."
  transaction_cost:
    fee: null
    spread: null
    liquidity_penalty: null
    status: TBD

quantum:
  mode: demo_k_actions
  input_candidates: 8
  k_actions: 3
  action_levels_pct: [20]
  bit_encoding:
    type: one_binary_per_asset_action
    total_decision_bits: 8
    exact_state_upper_bound: 256
  qaoa:
    p: 1
    shots: 1024
    optimizer: COBYLA
    optimizer_maxiter: 200
    min_seeds: 10
    seeds: null
  exact_solver:
    required: true
    purpose: "reference nho cho demo"
  handoff_required_from_risk:
    - g_i
    - C_ij
    - c_i

outputs:
  required_artifacts:
    - data/processed/prices_adjusted.parquet
    - data/processed/returns.parquet
    - data/processed/market_features.parquet
    - data/processed/eligibility_daily.parquet
    - artifacts/regime/regime_daily.parquet
    - artifacts/regime/regime_summary.json
    - artifacts/scenarios/scenario_manifest.json
    - reports/scenario_validation.csv
    - risk_summary.json
    - qubo_input.json
    - quantum_result.json
  comparison_metrics:
    - runtime_seconds
    - memory_peak_mb
    - scenario_gate_status
    - CVaR_reduction_pct
    - transaction_cost_pct_nav
    - feasible_solution_rate
    - exact_vs_qaoa_gap

development_rules:
  - "Khong sua profile workflow_update de lam demo nhanh pass."
  - "Neu scenario gate fail, bao cao ro metric fail va run_mode NON_BASELINE_RUN."
  - "Moi so demo phai ghi kem profile_id=demo_fast."
  - "Khong noi 8 ma la do 22 ma con lai bi loai; day la subset rut gon."
