# Reduced-scope QAOA solver bakeoff — NON_BASELINE_RUN / NON_FINAL_CONFIG.
#
# Extends Decision-package downstream (financial params unchanged). Only SCOPE differs:
# 5 candidates / 10 decision bits so QAOA can finish on StatevectorSampler.
#
# Do NOT mix numbers from this file with the 20-bit production run (different qubo_hash).
# Do NOT claim quantum advantage (CLAUDE.md rule 18).

extends: workflow_update_downstream.yaml

profile:
  id: qaoa_benchmark_10bit
  parent_profile_id: workflow_update
  status: NON_BASELINE_RUN
  report_label: "Reduced-scope QAOA benchmark — 5 candidates / 10 decision bits"
  allowed_for:
    - solver_benchmark_only
  not_allowed_for:
    - final_uat_baseline
    - product_claim_full_workflow
    - quantum_advantage_claim
    - comparison_with_20bit_run

provenance:
  config_version: "qaoa-benchmark-10bit-v1"
  derived_from: "configs/provisional/workflow_update_downstream.yaml"

runtime:
  candidate_count: 5
  bits_per_candidate: 2
  total_decision_bits: 10
  action_levels_pct: [0, 10, 20, 30]
  structured_sample_count: 56
  structured_design:
    intercept: 1
    main_effects: 10
    pairwise_effects: 45
  baseline_target:
    candidate_count: 5
    total_decision_bits: 10
    structured_sample_count: 56

candidate_selection:
  output_candidates: 5

quantum:
  input_candidates: 5
  bit_encoding:
    bits_per_asset: 2
    asset_count: 5
    total_decision_bits: 10
    exact_reference_states: 1024
  qaoa:
    # Same registered seeds as downstream; NON_FINAL because SCOPE is reduced, not because
    # shots/seeds were cut.
    final_config: false
    NON_FINAL_CONFIG: true
    warm_start: true
    dev_mode:
      enabled: false

performance_budget:
  qaoa_seed_timeout_seconds: 300
  qaoa_total_timeout_seconds: 1800

artifacts:
  root: artifacts_bench

disclosures:
  - "REDUCED SCOPE: 5 candidates / 10 qubit — not the 20-bit production run."
  - "NON_BASELINE_RUN; solver quality only — not UAT."
  - "Do not compare directly with the 20-bit run (different qubo_hash)."
