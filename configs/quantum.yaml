k_actions: 3  # đã khóa — CLAUDE.md: "chọn đúng K=3 hành động"

qaoa:
  p: 1                    # đã khóa — Warm-start QAOA p=1 là cấu hình chính (README.md, mvp_scope.md §11.3)
  shots: 1024              # đã khóa — README.md/CLAUDE.md
  optimizer: COBYLA         # đã khóa — README.md "Phiên bản đã kiểm chứng" (code mẫu đã test ra nghiệm khớp exact solver)
  optimizer_maxiter: 200    # đã khóa — cùng nguồn trên
  min_seeds: 10              # đã khóa — README.md/CLAUDE.md: "tối thiểu 10 seed"
  # TODO(Đỗ Ngọc Tân): danh sách seed cụ thể (≥10) phải được đăng ký trước khi chạy final —
  # không cherry-pick seed (CLAUDE.md quy tắc quantum 15/18).
  seeds: null

