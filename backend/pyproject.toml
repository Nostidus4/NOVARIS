[project]
name = "qshield-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qshield-contracts",
    "qshield-risk",
    "qshield-quantum",
    "qshield-pipeline",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "supabase>=2.15",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
qshield-contracts = { workspace = true, editable = true }
qshield-risk = { workspace = true, editable = true }
qshield-quantum = { workspace = true, editable = true }
qshield-pipeline = { workspace = true, editable = true }
