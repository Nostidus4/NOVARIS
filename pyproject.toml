[project]
name = "qshield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "hmmlearn>=0.3",
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "pandera>=0.20",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "qiskit>=2.0,<3",
    "qiskit-aer>=0.15",
    "qiskit-algorithms>=0.4",
    "qiskit-optimization>=0.7",
    "qshield-contracts",
    "qshield-data",
    "qshield-ai",
    "qshield-risk",
    "qshield-quantum",
    "qshield-pipeline",
    "qshield-api",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/data",
    "packages/ai",
    "packages/risk",
    "packages/quantum",
    "packages/pipeline",
    "backend",
]

[tool.uv.sources]
qshield-contracts = { workspace = true, editable = true }
qshield-data = { workspace = true, editable = true }
qshield-ai = { workspace = true, editable = true }
qshield-risk = { workspace = true, editable = true }
qshield-quantum = { workspace = true, editable = true }
qshield-pipeline = { workspace = true, editable = true }
qshield-api = { workspace = true, editable = true }
