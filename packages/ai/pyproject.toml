[project]
name = "qshield-ai"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qshield-contracts",
    "hmmlearn>=0.3",
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "scipy>=1.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
qshield-contracts = { workspace = true, editable = true }

[project.scripts]
qshield-ai = "qshield_ai.cli:app"
