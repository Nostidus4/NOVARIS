[project]
name = "qshield-data"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qshield-contracts",
    "pandas>=2.2,<3",
    "pyarrow>=17.0",
    "pandera>=0.20",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "pyyaml>=6.0",
    "requests>=2.32",
    "yfinance>=0.2.60",
    "vnstock>=3.2",
    "openpyxl>=3.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
qshield-contracts = { workspace = true, editable = true }

[project.scripts]
qshield-data = "qshield_data.cli:app"
